<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スリム目指すログ">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>スリム目指すログ</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #16202a;
    --sub: #6b7684;
    --border: #e6e9ed;
    --accent: #3b82f6;
    --accent-2: #f97316;
    --danger: #ef4444;
    --pill-bg: #eef1f4;
    --shadow: 0 1px 3px rgba(20,25,30,0.06), 0 1px 2px rgba(20,25,30,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14;
      --card: #161b22;
      --text: #eef2f6;
      --sub: #8b96a3;
      --border: #262d36;
      --accent: #5b9bff;
      --accent-2: #ffa15c;
      --danger: #ff6b6b;
      --pill-bg: #1f2630;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 8px;
  }
  header.top {
    padding: 14px 16px 6px;
    text-align: center;
  }
  header.top h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .date-row {
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .date-display {
    font-size: 15px;
    font-weight: 600;
  }
  .date-display .dow {
    color: var(--accent);
    margin-left: 4px;
  }
  input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    color: var(--sub);
    background: var(--pill-bg);
    border: none;
    border-radius: 10px;
    padding: 6px 8px;
    color-scheme: light dark;
  }
  .segmented {
    display: flex;
    background: var(--pill-bg);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 14px;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--sub);
    border-radius: 9px;
    font-family: inherit;
  }
  .segmented button.active {
    background: var(--accent);
    color: white;
  }
  .mic-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 6px 0 16px;
  }
  .mic-btn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(180deg, var(--accent), #2563eb);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(59,130,246,0.35);
  }
  .mic-btn.listening {
    animation: pulse 1.1s infinite;
    background: linear-gradient(180deg, var(--danger), #dc2626);
    box-shadow: 0 6px 16px rgba(239,68,68,0.4);
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .mic-btn svg { width: 34px; height: 34px; }
  .mic-status {
    font-size: 13px;
    color: var(--sub);
    min-height: 18px;
    text-align: center;
  }
  .fields {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .field {
    flex: 1;
    background: var(--pill-bg);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--sub);
    margin-bottom: 2px;
  }
  .field .input-line {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .field input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    font-family: inherit;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .field .unit {
    font-size: 13px;
    color: var(--sub);
    font-weight: 600;
  }
  .save-btn {
    width: 100%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 0;
    border-radius: 14px;
    font-family: inherit;
  }
  .save-btn:active { opacity: 0.85; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: rgba(20,25,30,0.92);
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
  }
  .toast.show { opacity: 1; }
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .week-nav button {
    border: none;
    background: var(--pill-bg);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 16px;
    font-family: inherit;
  }
  .week-nav .week-label {
    font-size: 13px;
    color: var(--sub);
    font-weight: 600;
  }
  .chart-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    margin: 10px 0 2px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .chart-wrap { width: 100%; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    padding: 20px 0;
  }
  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  .li-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .li-period {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 6px;
    background: var(--pill-bg);
    color: var(--sub);
  }
  .li-date {
    font-size: 13px;
    font-weight: 600;
  }
  .li-values {
    font-size: 13px;
    color: var(--sub);
    display: flex;
    gap: 8px;
  }
  .li-values b { color: var(--text); }
  .li-actions button {
    border: none;
    background: transparent;
    color: var(--sub);
    font-size: 16px;
    padding: 4px 8px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--sub);
    margin: 4px 0 8px;
    padding: 0 4px;
  }
  .hint {
    font-size: 12px;
    color: var(--sub);
    text-align: center;
    margin-top: -4px;
    margin-bottom: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<header class="top"><h1>スリム目指すログ</h1></header>
<div class="wrap">

  <div class="card">
    <div class="row date-row">
      <div class="date-display" id="dateDisplay"></div>
      <input type="date" id="datePicker">
    </div>
    <div class="segmented" id="periodSeg">
      <button data-period="am" class="active">朝</button>
      <button data-period="pm">晩</button>
    </div>

    <div class="mic-area">
      <button class="mic-btn" id="micBtn" aria-label="音声入力">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="mic-status" id="micStatus">タップして「56.1、30.1」のように話す</div>
    </div>

    <div class="fields">
      <div class="field">
        <label>体重</label>
        <div class="input-line">
          <input type="number" inputmode="decimal" step="0.1" id="weightInput" placeholder="0.0">
          <span class="unit">kg</span>
        </div>
      </div>
      <div class="field">
        <label>体脂肪率</label>
        <div class="input-line">
          <input type="number" inputmode="decimal" step="0.1" id="fatInput" placeholder="0.0">
          <span class="unit">%</span>
        </div>
      </div>
    </div>

    <button class="save-btn" id="saveBtn">記録する</button>
  </div>

  <div class="card">
    <div class="week-nav">
      <button id="prevWeek">‹</button>
      <div class="week-label" id="weekLabel"></div>
      <button id="nextWeek">›</button>
    </div>

    <div class="chart-title"><span class="dot" style="background:var(--accent)"></span>体重の推移 (kg)</div>
    <div class="chart-wrap" id="weightChart"></div>

    <div class="chart-title"><span class="dot" style="background:var(--accent-2)"></span>体脂肪率の推移 (%)</div>
    <div class="chart-wrap" id="fatChart"></div>
  </div>

  <div class="card">
    <div class="section-title">今週の記録</div>
    <div id="listArea"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var STORAGE_KEY = 'weightlog.entries.v1';
  var DOW = ['日','月','火','水','木','金','土'];
  var DOW_MONFIRST = ['月','火','水','木','金','土','日'];

  var state = {
    date: fmtDate(new Date()),
    period: 'am',
    weekOffset: 0,
    entries: load()
  };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries));
  }
  function fmtDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function parseDate(s) {
    var parts = s.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function mondayOf(d) {
    var day = d.getDay(); // 0 Sun .. 6 Sat
    var diff = (day === 0 ? -6 : 1 - day);
    var m = new Date(d);
    m.setDate(d.getDate() + diff);
    m.setHours(0,0,0,0);
    return m;
  }
  function addDays(d, n) {
    var r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }
  function findEntry(date, period) {
    for (var i = 0; i < state.entries.length; i++) {
      if (state.entries[i].date === date && state.entries[i].period === period) return state.entries[i];
    }
    return null;
  }

  // ---- date/period UI ----
  var dateDisplay = document.getElementById('dateDisplay');
  var datePicker = document.getElementById('datePicker');
  var periodSeg = document.getElementById('periodSeg');
  var weightInput = document.getElementById('weightInput');
  var fatInput = document.getElementById('fatInput');
  var saveBtn = document.getElementById('saveBtn');

  function refreshDateDisplay() {
    var d = parseDate(state.date);
    dateDisplay.textContent = (d.getMonth()+1) + '月' + d.getDate() + '日';
    var span = document.createElement('span');
    span.className = 'dow';
    span.textContent = '(' + DOW[d.getDay()] + ')';
    dateDisplay.appendChild(span);
    datePicker.value = state.date;
  }

  function refreshForm() {
    var existing = findEntry(state.date, state.period);
    if (existing) {
      weightInput.value = existing.weight;
      fatInput.value = existing.bodyFat;
      saveBtn.textContent = '更新する';
    } else {
      weightInput.value = '';
      fatInput.value = '';
      saveBtn.textContent = '記録する';
    }
  }

  datePicker.addEventListener('change', function () {
    if (datePicker.value) {
      state.date = datePicker.value;
      refreshDateDisplay();
      refreshForm();
    }
  });

  periodSeg.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      periodSeg.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.period = btn.dataset.period;
      refreshForm();
    });
  });

  // ---- save ----
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  saveBtn.addEventListener('click', function () {
    var w = parseFloat(weightInput.value);
    var f = parseFloat(fatInput.value);
    if (isNaN(w) || w < 20 || w > 300) {
      alert('体重を正しく入力してください');
      return;
    }
    if (isNaN(f) || f < 3 || f > 70) {
      alert('体脂肪率を正しく入力してください');
      return;
    }
    var existing = findEntry(state.date, state.period);
    if (existing) {
      existing.weight = w;
      existing.bodyFat = f;
      existing.ts = Date.now();
    } else {
      state.entries.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        date: state.date,
        period: state.period,
        weight: w,
        bodyFat: f,
        ts: Date.now()
      });
    }
    save();
    refreshForm();
    renderWeek();
    showToast('保存しました');
  });

  // ---- voice input ----
  var micBtn = document.getElementById('micBtn');
  var micStatus = document.getElementById('micStatus');
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizing = false;
  var recognizer = null;

  if (!SpeechRecognitionCtor) {
    micStatus.textContent = 'この端末・ブラウザは音声入力に対応していません。手入力してください';
    micBtn.style.opacity = '0.4';
  } else {
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = 'ja-JP';
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 3;

    recognizer.onstart = function () {
      recognizing = true;
      micBtn.classList.add('listening');
      micStatus.textContent = '聞き取り中… 「体重、体脂肪率」の順に話してください';
    };
    recognizer.onend = function () {
      recognizing = false;
      micBtn.classList.remove('listening');
    };
    recognizer.onerror = function (e) {
      recognizing = false;
      micBtn.classList.remove('listening');
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        micStatus.textContent = 'マイクの使用が許可されていません（設定で許可してください）';
      } else if (e.error === 'no-speech') {
        micStatus.textContent = '聞き取れませんでした。もう一度お試しください';
      } else {
        micStatus.textContent = '認識エラー: ' + e.error;
      }
    };
    recognizer.onresult = function (e) {
      var transcript = '';
      for (var i = 0; i < e.results.length; i++) {
        transcript += e.results[i][0].transcript;
      }
      handleTranscript(transcript);
    };

    micBtn.addEventListener('click', function () {
      if (recognizing) {
        recognizer.stop();
        return;
      }
      try {
        recognizer.start();
      } catch (err) {
        micStatus.textContent = '開始できませんでした。もう一度タップしてください';
      }
    });
  }

  function handleTranscript(text) {
    var nums = text.match(/\d+(\.\d+)?/g);
    if (!nums || nums.length === 0) {
      micStatus.textContent = '「' + text + '」→ 数字を聞き取れませんでした。手入力してください';
      return;
    }
    weightInput.value = nums[0];
    if (nums.length >= 2) {
      fatInput.value = nums[1];
      micStatus.textContent = '「' + text + '」→ 体重 ' + nums[0] + ' / 体脂肪率 ' + nums[1] + '。内容を確認して記録してください';
    } else {
      micStatus.textContent = '「' + text + '」→ 体重 ' + nums[0] + '。体脂肪率は手入力してください';
    }
  }

  // ---- week charts + list ----
  var weekLabel = document.getElementById('weekLabel');
  var prevWeekBtn = document.getElementById('prevWeek');
  var nextWeekBtn = document.getElementById('nextWeek');
  var listArea = document.getElementById('listArea');

  prevWeekBtn.addEventListener('click', function () { state.weekOffset -= 1; renderWeek(); });
  nextWeekBtn.addEventListener('click', function () { state.weekOffset += 1; renderWeek(); });

  function currentWeekDates() {
    var monday = mondayOf(new Date());
    monday = addDays(monday, state.weekOffset * 7);
    var days = [];
    for (var i = 0; i < 7; i++) days.push(addDays(monday, i));
    return days;
  }

  function buildSVGChart(slotValues, color) {
    // slotValues: array length 14 of number|null
    var w = 320, h = 130, padL = 30, padR = 10, padT = 10, padB = 22;
    var chartW = w - padL - padR, chartH = h - padT - padB;

    var present = slotValues.filter(function (v) { return v !== null; });
    if (present.length === 0) {
      return '<div class="empty">まだ記録がありません</div>';
    }
    var min = Math.min.apply(null, present);
    var max = Math.max.apply(null, present);
    if (min === max) { min -= 1; max += 1; }
    var pad = (max - min) * 0.15;
    min -= pad; max += pad;

    function xAt(i) { return padL + (chartW * i) / 13; }
    function yAt(v) { return padT + chartH - ((v - min) / (max - min)) * chartH; }

    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

    // gridlines (4 rows)
    var rows = 4;
    for (var r = 0; r <= rows; r++) {
      var yy = padT + (chartH * r) / rows;
      var val = max - ((max - min) * r) / rows;
      svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>';
      svg += '<text x="4" y="' + (yy + 3) + '" font-size="8" fill="var(--sub)">' + val.toFixed(1) + '</text>';
    }

    // day labels (under each day's AM/PM pair, i.e. every 2 slots)
    for (var d = 0; d < 7; d++) {
      var cx = (xAt(d * 2) + xAt(d * 2 + 1)) / 2;
      svg += '<text x="' + cx + '" y="' + (h - 6) + '" font-size="8" fill="var(--sub)" text-anchor="middle">' + DOW_MONFIRST[d] + '</text>';
    }

    // line segments (break on null)
    var pathParts = [];
    var current = [];
    for (var i = 0; i < 14; i++) {
      if (slotValues[i] === null) {
        if (current.length > 1) pathParts.push(current);
        current = [];
        continue;
      }
      current.push([xAt(i), yAt(slotValues[i])]);
    }
    if (current.length > 1) pathParts.push(current);

    pathParts.forEach(function (pts) {
      var d2 = pts.map(function (p, idx) { return (idx === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      svg += '<path d="' + d2 + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });

    // points
    for (var j = 0; j < 14; j++) {
      if (slotValues[j] === null) continue;
      var isPM = (j % 2) === 1;
      svg += '<circle cx="' + xAt(j) + '" cy="' + yAt(slotValues[j]) + '" r="3.2" fill="' + (isPM ? 'var(--card)' : color) + '" stroke="' + color + '" stroke-width="2"/>';
    }

    svg += '</svg>';
    return svg;
  }

  function renderWeek() {
    var days = currentWeekDates();
    var first = days[0], last = days[6];
    if (state.weekOffset === 0) {
      weekLabel.textContent = '今週 (' + (first.getMonth()+1) + '/' + first.getDate() + ' - ' + (last.getMonth()+1) + '/' + last.getDate() + ')';
    } else {
      weekLabel.textContent = (first.getMonth()+1) + '/' + first.getDate() + ' - ' + (last.getMonth()+1) + '/' + last.getDate();
    }

    var weightSlots = new Array(14).fill(null);
    var fatSlots = new Array(14).fill(null);
    var weekEntries = [];

    days.forEach(function (d, idx) {
      var dateStr = fmtDate(d);
      ['am', 'pm'].forEach(function (p, pIdx) {
        var e = findEntry(dateStr, p);
        if (e) {
          weightSlots[idx * 2 + pIdx] = e.weight;
          fatSlots[idx * 2 + pIdx] = e.bodyFat;
          weekEntries.push(e);
        }
      });
    });

    document.getElementById('weightChart').innerHTML = buildSVGChart(weightSlots, getVar('--accent'));
    document.getElementById('fatChart').innerHTML = buildSVGChart(fatSlots, getVar('--accent-2'));

    weekEntries.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.period === 'pm' ? -1 : 1;
    });

    if (weekEntries.length === 0) {
      listArea.innerHTML = '<div class="empty">今週の記録はまだありません</div>';
    } else {
      listArea.innerHTML = weekEntries.map(function (e) {
        var d = parseDate(e.date);
        return '<div class="list-item" data-id="' + e.id + '">' +
          '<div class="li-left">' +
            '<span class="li-period">' + (e.period === 'am' ? '朝' : '晩') + '</span>' +
            '<span class="li-date">' + (d.getMonth()+1) + '/' + d.getDate() + '(' + DOW[d.getDay()] + ')</span>' +
          '</div>' +
          '<div class="row">' +
            '<div class="li-values"><b>' + e.weight.toFixed(1) + '</b>kg<b>' + e.bodyFat.toFixed(1) + '</b>%</div>' +
            '<div class="li-actions"><button data-del="' + e.id + '">🗑</button></div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
  }

  function getVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim() || (name === '--accent' ? '#3b82f6' : '#f97316');
  }

  listArea.addEventListener('click', function (e) {
    var id = e.target.getAttribute('data-del');
    if (!id) return;
    if (confirm('この記録を削除しますか？')) {
      state.entries = state.entries.filter(function (en) { return en.id !== id; });
      save();
      renderWeek();
      refreshForm();
    }
  });

  // ---- init ----
  refreshDateDisplay();
  refreshForm();
  renderWeek();
})();
</script>
</body>
</html>
